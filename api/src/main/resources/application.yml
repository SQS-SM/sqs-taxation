spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payroll
    username: postgres
    password: Manbehind5
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    url: jdbc:postgresql://localhost:5432/payroll
    username: postgres
    user: postgres
    password: Manbehind5
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082
  servlet:
    context-path: /ds-tax-service
logging:
  config: classpath:logback-spring.xml
  level:
    net.ttddyy.dsproxy.listener: DEBUG
